<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Booking Confirmed — CineHall</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>

<nav class="topnav">
  <div class="topnav-inner">
    <a href="index.html" class="brand"><span class="brand-mark"></span>CineHall</a>
    <ul class="nav-links"><li><a href="index.html">Movies</a></li></ul>
  </div>
</nav>

<div class="container" style="padding:44px 28px 60px;" id="page"></div>

<script src="script.js"></script>
<script>
// the server already returns the movie / cinema / date details inside the booking
const booking = JSON.parse(sessionStorage.getItem('ch_last_booking')||'null');
const page = qs('#page');

if(!booking){
  page.innerHTML = `<div class="empty-state"><div class="h-display">No recent booking</div><a href="index.html" style="color:var(--gold)">Browse movies</a></div>`;
} else {
  page.innerHTML = `
    <div style="text-align:center; margin-bottom:26px;">
      <p class="eyebrow" style="justify-content:center;">Booking confirmed</p>
      <h1 class="h-display" style="font-size:2rem; margin-top:6px;">Enjoy the show</h1>
    </div>

    <div class="ticket">
      <div class="ticket-top">
        <p class="muted" style="font-size:.78rem;">${esc(booking.cinema)}</p>
        <h2 class="h-display" style="font-size:1.7rem; margin:2px 0 10px;">${esc(booking.movieTitle)}</h2>
        <div style="display:flex; justify-content:space-between; font-size:.86rem;">
          <div><p class="muted" style="font-size:.72rem;">DATE</p><p>${fmtDate(booking.date)}</p></div>
          <div><p class="muted" style="font-size:.72rem;">TIME</p><p>${booking.time}</p></div>
          <div><p class="muted" style="font-size:.72rem;">SEATS</p><p class="mono" style="color:var(--gold);">${booking.seats.join(', ')}</p></div>
        </div>
      </div>
      <div class="ticket-divider"></div>
      <div class="ticket-bottom">
        <div>
          <p class="muted" style="font-size:.72rem;">TICKET CODE</p>
          <p class="ticket-code">${esc(booking.code)}</p>
          <p class="muted" style="font-size:.76rem; margin-top:6px;">${esc(booking.name)} · ₹${booking.total}</p>
        </div>
        <div class="qr-box" title="Scan at entry"></div>
      </div>
    </div>

    <div style="display:flex; gap:12px; justify-content:center; margin-top:26px; flex-wrap:wrap;">
      <a href="my-bookings.html" class="btn btn-outline">View My Bookings</a>
      <a href="index.html" class="btn btn-gold">Book Another Movie</a>
    </div>
  `;
}
</script>
</body>
</html>
