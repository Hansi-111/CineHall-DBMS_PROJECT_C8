<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Bookings — CineHall</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>

<nav class="topnav">
  <div class="topnav-inner">
    <a href="index.html" class="brand"><span class="brand-mark"></span>CineHall</a>
    <ul class="nav-links">
      <li><a href="index.html">Movies</a></li>
      <li><a href="my-bookings.html" class="active">My Bookings</a></li>
    </ul>
  </div>
</nav>

<div class="container" style="padding:36px 28px 60px;">
  <p class="eyebrow" style="margin-bottom:6px;">Your tickets</p>
  <h1 class="h-display" style="font-size:2rem; margin-bottom:22px;">My Bookings</h1>
  <div id="bookingsList" style="margin-top:20px; display:flex; flex-direction:column; gap:14px;"></div>
</div>

<script src="script.js"></script>
<script>
const listEl = qs('#bookingsList');

async function render(){
  let bookings;
  try{ bookings = await DB.getBookings(); }catch(e){ toast(e.message); return; }

  if(!bookings.length){
    listEl.innerHTML = `<div class="empty-state"><div class="h-display">No bookings yet</div><p>Pick a film and book your first seats.</p></div>`;
    return;
  }
  const d = new Date();
  const today = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;

  listEl.innerHTML = bookings.map(b=>{
    const badgeClass = b.status==='cancelled' ? 'status-cancelled' : 'status-confirmed';
    const isPast = b.date < today;
    const canCancel = b.status==='confirmed' && !isPast;
    return `
    <div class="card" style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:12px;">
      <div>
        <p style="font-weight:700;">${esc(b.movieTitle)}</p>
        <p class="muted" style="font-size:.84rem; margin-top:2px;">${esc(b.cinema)} · ${fmtDate(b.date)} · ${b.time} · <span class="mono">${b.seats.join(', ')}</span></p>
      </div>
      <div style="text-align:right; display:flex; flex-direction:column; align-items:flex-end; gap:8px;">
        <div>
          <span class="status-badge ${badgeClass}">${b.status}</span>
          <p class="mono" style="margin-top:6px; color:var(--gold); font-size:.86rem;">${esc(b.code)}</p>
        </div>
        ${canCancel
          ? `<button class="btn btn-danger btn-sm" data-cancel="${b.id}">Cancel Ticket</button>`
          : (b.status==='confirmed' && isPast ? `<span class="muted" style="font-size:.76rem;">Show has passed</span>` : '')}
      </div>
    </div>`;
  }).join('');

  qsa('[data-cancel]').forEach(btn=>{
    btn.addEventListener('click', async ()=>{
      if(!confirm('Cancel this ticket? This cannot be undone.')) return;
      try{ await DB.cancelBooking(btn.dataset.cancel); toast('Ticket cancelled'); render(); }
      catch(e){ toast(e.message); }
    });
  });
}

if(requireAuth()) render();
</script>
</body>
</html>
