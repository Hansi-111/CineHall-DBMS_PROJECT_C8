<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Select Seats — CineHall</title>
<link rel="stylesheet" href="styles.css">
</head>
<body style="display:flex; flex-direction:column; min-height:100vh;">

<nav class="topnav">
  <div class="topnav-inner">
    <a href="index.html" class="brand"><span class="brand-mark"></span>CineHall</a>
    <ul class="nav-links"><li><a href="index.html">Movies</a></li></ul>
  </div>
</nav>

<div class="container" id="page" style="padding:30px 28px; flex:1;"></div>

<script src="script.js"></script>
<script>
async function init(){
  if(!requireAuth()) return;
  const page = qs('#page');

  const show = await DB.getShow(getParam('showId'));
  if(!show){
    page.innerHTML = `<div class="empty-state"><div class="h-display">Show not found</div><a href="index.html" style="color:var(--gold)">Back to movies</a></div>`;
    return;
  }
  const [movie, seats] = await Promise.all([DB.getMovie(show.movieId), DB.getSeats(show.id)]);

  page.innerHTML = `
    <p class="eyebrow"><a href="movie-details.html?id=${movie.id}" style="color:var(--gold)">← ${esc(movie.title)}</a></p>
    <h1 class="h-display" style="font-size:1.8rem; margin:8px 0 2px;">${esc(movie.title)}</h1>
    <p class="muted" style="margin-bottom:24px;">${esc(show.cinema)} · Screen ${show.screenNumber} · ${fmtDate(show.date)} · ${show.time}</p>

    <div class="screen-arc"><span>Screen</span></div>
    <div class="seat-map" id="seatMap"></div>
    <div class="seat-legend">
      <span><span class="dot" style="background:var(--surface-2); border:1px solid var(--border);"></span>Available</span>
      <span><span class="dot" style="background:var(--gold);"></span>Selected</span>
      <span><span class="dot" style="background:var(--velvet-dim); border:1px solid var(--velvet);"></span>Booked</span>
      <span><span class="dot" style="background:var(--surface-2); border:1px solid var(--gold-dim);"></span>Premium ₹${show.price.premium}</span>
      <span><span class="dot" style="background:var(--surface-2); border:1px solid var(--border);"></span>Gold ₹${show.price.gold} · Silver ₹${show.price.silver}</span>
    </div>
  `;

  const bar = document.createElement('div');
  bar.className = 'booking-bar';
  bar.innerHTML = `
    <div><span id="seatCount" class="mono">0 seats</span> <span class="muted" id="seatList"></span></div>
    <div style="display:flex; align-items:center; gap:16px;">
      <span class="h-display" style="font-size:1.5rem;">₹<span id="totalPrice">0</span></span>
      <button class="btn btn-gold" id="confirmBtn" disabled>Confirm Seats</button>
    </div>`;
  document.body.appendChild(bar);

  const map = buildSeatMap(qs('#seatMap'), show, seats, {
    maxSelect: 8,
    onChange(selected){
      qs('#seatCount').textContent = `${selected.length} seat${selected.length===1?'':'s'}`;
      qs('#seatList').textContent = selected.join(', ');
      qs('#totalPrice').textContent = map.totalPrice();
      qs('#confirmBtn').disabled = selected.length === 0;
    }
  });

  qs('#confirmBtn').addEventListener('click', ()=>{
    const selected = map.getSelected();
    if(!selected.length) return;
    sessionStorage.setItem('ch_pending_booking', JSON.stringify({
      showId: show.id, seats: selected, seatIds: map.getSelectedIds(), total: map.totalPrice()
    }));
    location.href = 'checkout.html';
  });
}
init().catch(e=>toast(e.message));
</script>
</body>
</html>
