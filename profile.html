<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Profile — CineHall</title>
<link rel="stylesheet" href="styles.css">
</head>

<body>

<nav class="topnav">
  <div class="topnav-inner">
    <a href="index.html" class="brand"><span class="brand-mark"></span>CineHall</a>

    <ul class="nav-links">
      <li><a href="index.html">Movies</a></li>
      <li><a href="my-bookings.html">My Bookings</a></li>
      <li><a href="profile.html" class="active">Profile</a></li>
    </ul>
  </div>
</nav>

<div class="container" style="padding:40px 28px 60px;">

  <div class="card" style="max-width:520px; margin:auto;">

    <div style="text-align:center; margin-bottom:24px;">

      <div id="avatar"
           style="width:90px; height:90px; border-radius:50%;
                  background:var(--gold); color:#1a1204;
                  display:grid; place-items:center;
                  font-size:2rem; font-weight:800;
                  margin:0 auto 14px;">
      </div>

      <h1 class="h-display" id="profileName">User</h1>

      <p class="muted" id="profileEmail">email@example.com</p>

    </div>

    <div style="display:grid; gap:14px;">

      <div class="card" style="padding:16px;">
        <p class="muted" style="font-size:.82rem;">Account Type</p>
        <p style="font-weight:700; margin-top:4px;">Customer</p>
      </div>

    </div>

    <div class="profile-actions"
         style="display:flex; gap:12px; justify-content:center;
                margin-top:26px; flex-wrap:wrap;">

      <a href="my-bookings.html" class="btn btn-outline">
        View My Bookings
      </a>

      <button class="btn btn-gold" id="logoutBtn">
        Logout
      </button>

    </div>

  </div>

</div>

<script src="api.js"></script>
<script src="script.js"></script>
<script>
(async () => {
  const session = api.user();

  if(!session || session.role !== 'customer'){
    location.href = 'login.html';
    return;
  }

  qs('#profileName').textContent = session.name;
  qs('#profileEmail').textContent = session.email;

  const initials = session.name
    .split(' ')
    .map(w => w[0])
    .join('')
    .slice(0,2)
    .toUpperCase();

  qs('#avatar').textContent = initials;

  qs('#logoutBtn').addEventListener('click', ()=>{
    api.clearSession();
    toast('Signed out');
    location.href = 'index.html';
  });
})();
</script>
</body>
</html>
