<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Sign In — CineHall</title>
<link rel="stylesheet" href="styles.css">
</head>

<body>

<div class="auth-shell">
  <div class="auth-card">
    <div style="text-align:center; margin-bottom:26px;">
      <a href="index.html" class="brand" style="justify-content:center; display:flex;"><span class="brand-mark"></span>CineHall</a>
      <p class="eyebrow" style="justify-content:center; margin-top:8px;">Admin console</p>
    </div>
    <div class="card">
      <form id="adminLoginForm">
        <div class="field"><label for="a-user">Admin username</label><input id="a-user" required></div>
        <div class="field"><label for="a-pass">Password</label><input id="a-pass" type="password" required></div>
        <button class="btn btn-gold btn-block" type="submit">Enter Dashboard</button>
      </form>
    </div>
    <p class="muted" style="text-align:center; margin-top:16px; font-size:.82rem;">
      Contact the site administrator for login credentials.
    </p>
  </div>
</div>

<script src="api.js"></script>
<script src="script.js"></script>
<script>
qs('#adminLoginForm').addEventListener('submit', async e=>{
  e.preventDefault();
  try {
    const u = await api.login(qs('#a-user').value, qs('#a-pass').value);
    if(!api.isStaff()){
      /* Right password, wrong kind of account: a customer signed in
         on the staff form would otherwise land on a dashboard that
         immediately bounces them back here. */
      api.clearSession();
      toast('That account is not an admin');
      return;
    }
    location.href = 'admin-dashboard.html';
  } catch(err) {
    toast(isApiError(err) && err.errors.length ? err.errors[0].message : 'Invalid credentials');
  }
});
</script>
</body>
</html>
