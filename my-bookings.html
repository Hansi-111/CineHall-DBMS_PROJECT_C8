<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Bookings — CineHall</title>
<link rel="stylesheet" href="styles.css">
</head>

<body>

<nav class="topnav">
  <div class="topnav-inner">
    <a href="index.html" class="brand"><span class="brand-mark"></span>CineHall</a>
    <ul class="nav-links">
      <li><a href="index.html">Movies</a></li>
      <li><a href="my-bookings.html" class="active">My Bookings</a></li>
    </ul>
  </div>
</nav>

<div class="container" style="padding:36px 28px 60px;">
  <p class="eyebrow" style="margin-bottom:6px;">Your tickets</p>
  <h1 class="h-display" style="font-size:2rem; margin-bottom:22px;">My Bookings</h1>

  <div class="field" style="max-width:340px;">
    <label for="emailFilter">Look up by email used at checkout</label>
    <input id="emailFilter" type="email" placeholder="you@example.com">
  </div>

  <div id="bookingsList" style="margin-top:20px; display:flex; flex-direction:column; gap:14px;"></div>
</div>

<script src="api.js"></script>
<script src="script.js"></script>
<script>
(async () => {
  const listEl = qs('#bookingsList');
  const session = api.user();

  /* Signed-in users default to their own email; guests can still look
     up by typing one. Either way the server does the filtering. */
  if(session && session.email) qs('#emailFilter').value = session.email;

  async function render(){
    const email = qs('#emailFilter').value.trim();
    renderLoading(listEl, 'Looking up bookings…');

    try {
      /* The list endpoint already carries the movie title, theatre,
         date, time and seat labels, so no per-booking follow-up
         requests are needed. */
      const bookings = await api.bookings(email ? { q: email } : {});

      if(!bookings.length){
        listEl.innerHTML = `<div class="empty-state"><div class="h-display">No bookings found</div><p>Enter the email you used at checkout, or make a new booking.</p></div>`;
        return;
      }

      listEl.innerHTML = bookings.map(b=>{
        const badgeClass = b.status==='cancelled' ? 'status-cancelled' : 'status-confirmed';
        const seatLabels = (b.seats || []).join(', ');
        return `
        <div class="card" style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:12px;">
          <div>
            <p style="font-weight:700;">${escapeHtml(b.movieTitle)}</p>
            <p class="muted" style="font-size:.84rem; margin-top:2px;">${escapeHtml(b.cinema)} · ${fmtDate(b.date)} · ${b.time} · <span class="mono">${escapeHtml(seatLabels)}</span></p>
          </div>
          <div style="text-align:right; display:flex; flex-direction:column; align-items:flex-end; gap:8px;">
            <div>
              <span class="status-badge ${badgeClass}">${b.status}</span>
              <p class="mono" style="margin-top:6px; color:var(--gold); font-size:.86rem;">${escapeHtml(b.code)}</p>
            </div>
            ${b.canCancel
              ? `<button class="btn btn-danger btn-sm" data-cancel="${b.id}">Cancel Ticket</button>`
              : (b.status==='confirmed' ? `<span class="muted" style="font-size:.76rem;">Cannot cancel now</span>` : '')}
          </div>
        </div>`;
      }).join('');

      /* Bound after every render: the buttons are recreated each time,
         so listeners attached once at load would go stale. */
      qsa('[data-cancel]').forEach(btn=>{
        btn.addEventListener('click', async ()=>{
          if(!confirm('Cancel this ticket? This cannot be undone.')) return;
          btn.disabled = true;
          try {
            await api.cancelBooking(btn.dataset.cancel);
            toast('Ticket cancelled');
            render();
          } catch(err) {
            btn.disabled = false;
            toast(isApiError(err) ? err.message : 'Cancel failed');
          }
        });
      });
    } catch(err) {
      renderError(listEl, err);
    }
  }

  let timer;
  qs('#emailFilter').addEventListener('input', ()=>{
    /* Debounced: without it every keystroke fires a request. */
    clearTimeout(timer);
    timer = setTimeout(render, 300);
  });
  render();
})();
</script>
</body>
</html>
